controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    steer_controller:
      type: position_controllers/JointGroupPositionController
    drive_controller:
      type: velocity_controllers/JointGroupVelocityController
steer_controller:
  ros__parameters:
    joints:
    - main_steer_joint
drive_controller:
  ros__parameters:
    joints:
    - main_drive_joint
