# gazebo_ros_control controllers. Joint names must match steer_joints / drive_joints in
# wonik_cobot_v2_description/config/geometry.yaml.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

steer_controller:
  type: position_controllers/JointGroupPositionController
  joints: [front_right_steer_joint, rear_left_steer_joint]

drive_controller:
  type: velocity_controllers/JointGroupVelocityController
  joints: [front_right_drive_joint, rear_left_drive_joint]
