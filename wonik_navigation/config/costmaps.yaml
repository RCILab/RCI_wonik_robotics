# Costmaps of move_base_flex. The robot footprint comes from config/<robot>/footprint.yaml.
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0
  publish_frequency: 1.0
  transform_tolerance: 0.5
  resolution: 0.05
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  static_layer:
    map_topic: /map
    subscribe_to_updates: false
  inflation_layer:
    inflation_radius: 0.6
    cost_scaling_factor: 5.0

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  width: 8.0
  height: 8.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  obstacle_layer:
    observation_sources: scan
    scan:
      topic: /scan
      data_type: LaserScan
      sensor_frame: base_footprint
      marking: true
      clearing: true
      inf_is_valid: true
      obstacle_range: 6.0
      raytrace_range: 8.0
  inflation_layer:
    inflation_radius: 0.6
    cost_scaling_factor: 5.0
