amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    tf_broadcast: true
    transform_tolerance: 0.2
    min_particles: 500
    max_particles: 3000
    pf_err: 0.01
    pf_z: 0.99
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    laser_model_type: likelihood_field
    laser_min_range: 0.2
    laser_max_range: 20.0
    max_beams: 180
    z_hit: 0.95
    z_rand: 0.05
    sigma_hit: 0.1
    laser_likelihood_max_dist: 2.0
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: scan
    set_initial_pose: true
