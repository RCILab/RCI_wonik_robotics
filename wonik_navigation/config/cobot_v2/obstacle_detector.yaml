# Obstacle detector for cobot_v2 (base_footprint). Front box: from the bumper (0.45 m) 1.5 m ahead,
# which covers the braking distance from 1.0 m/s at the base's 0.6 m/s^2 plus margin; 0.1 m wider than
# the body on each side; from just above the floor to the top of the lift column.
# Required sensors must deliver current data (measurement time within timeout) or the robot stops;
# navigation.launch.py drops the depth camera from this list with depth_camera:=false (switched off on
# purpose, not a failure).
required_topics: [/points, /camera/depth/points]
optional_topics: []
base_frame: base_footprint
box: {x_min: 0.45, x_max: 1.95, y_min: -0.45, y_max: 0.45, z_min: 0.06, z_max: 1.80}
# Turning in place: the corners sweep a circle of 0.57 m (navigation.yaml); obstacle points within this
# radius (outside the body, within the box heights) stop in-place turns at the gate.
turn_radius: 0.70
body: {x_min: -0.452, x_max: 0.452, y_min: -0.352, y_max: 0.352}
min_points: 5
# A cloud with fewer finite points is no measurement (e.g. an all-NaN depth image: a real depth camera
# also returns that for an object closer than its minimum range), so it never reads as "clear".
# Both sensors always see the floor or walls in normal operation.
min_valid_points: 100
timeout: 0.5
future_tolerance: 0.05
