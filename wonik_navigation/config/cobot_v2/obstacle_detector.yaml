# Detection box in front of cobot_v2 (base_footprint): from the bumper (0.45 m) 1.5 m ahead, which
# covers the braking distance from 1.0 m/s at the base's 0.6 m/s^2 plus margin; 0.1 m wider than the
# body on each side; from just above the floor to the top of the lift column.
cloud_topics: [/points, /camera/depth/points]
base_frame: base_footprint
box: {x_min: 0.45, x_max: 1.95, y_min: -0.45, y_max: 0.45, z_min: 0.06, z_max: 1.80}
min_points: 5
timeout: 0.5
