# move_base_flex (mbf_costmap_nav). All controllers are loaded at start-up; each ExePath goal names
# the one to use, so the route supervisor can switch controllers mid-route by resending the rest of
# the route.
global_frame: map
robot_frame: base_footprint
odom_topic: odom
tf_timeout: 1.0

controller_frequency: 20.0
controller_patience: 5.0
controller_max_retries: 1
# 0 = off: a robot held still on purpose (e.g. by an obstacle stop) must not count as oscillating
oscillation_timeout: 0.0
oscillation_distance: 0.2

planner_frequency: 0.0
planner_patience: 5.0
recovery_enabled: false
recovery_behaviors: []

controllers:
  - name: stop_go          # the route: straight legs, stop and turn at waypoints
    type: stop_go_local_planner/StopGoLocalPlanner
  - name: stop_go_slow     # the same, speed-limited
    type: stop_go_local_planner/StopGoLocalPlanner
  - name: avoid            # detours around obstacles (curved paths from the global planner)
    type: pure_pursuit_local_planner/PurePursuitLocalPlanner

planners:
  - name: global_planner
    type: global_planner/GlobalPlanner

global_planner:
  use_dijkstra: true
  use_quadratic: true
  use_grid_path: false
  allow_unknown: true
  default_tolerance: 0.2
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 3.0
  visualize_potential: false
